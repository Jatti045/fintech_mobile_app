spring.application.name=fintech-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:pwd}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000
spring.jpa.hibernate.ddl-auto=create-only
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret-key=${JWT_SECRET_KEY:}
app.mail.from=${EMAIL_USER:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.profile-folder=${CLOUDINARY_PROFILE_FOLDER:profile-pictures}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# Server-owned current exchange-rate model. Transaction amounts and all
# aggregates are normalized to the user's selected currency before persistence.
app.currency.rates-base-url=${CURRENCY_RATES_BASE_URL:https://api.exchangerate-api.com}
app.currency.rates-cache-seconds=${CURRENCY_RATES_CACHE_SECONDS:3600}
app.currency.rates-timeout-ms=${CURRENCY_RATES_TIMEOUT_MS:5000}

# AI provider (monthly financial explanation). Any OpenAI-compatible chat
# completions endpoint works via AI_BASE_URL (OpenAI, Groq, Ollama, gateways).
app.ai.provider=${AI_PROVIDER:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# Plaid
app.plaid.client-id=${PLAID_CLIENT_ID:}
app.plaid.secret=${PLAID_SECRET:}
app.plaid.environment=${PLAID_ENVIRONMENT:sandbox}
app.plaid.webhook-url=${PLAID_WEBHOOK_URL:}
app.plaid.country-codes=${PLAID_COUNTRY_CODES:US}
app.plaid.language=${PLAID_LANGUAGE:en}
app.plaid.access-token-secret=${PLAID_ACCESS_TOKEN_SECRET:}

# Redis (server-side cache for financial summary & recurring payments).
# PostgreSQL remains the source of truth; Redis is a best-effort read cache.
# Managed providers (Fly Redis / Upstash) supply these as host + password.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
# Short timeouts so a Redis outage fails fast instead of stalling requests.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:2000}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT_MS:2000}

server.address=0.0.0.0
